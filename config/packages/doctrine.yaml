doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        schema_filter: ~^(?!v_)~
        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # Force the connection collation to match the schema (utf8mb4_general_ci).
        #
        # Why: MariaDB 11.x defaults new connections to utf8mb4_uca1400_ai_ci.
        # The 'blog'/'reader' literals in the v_archive view kept the collation
        # in effect when the view was created (utf8mb4_general_ci), so a query
        # like "WHERE type = ?" mixes two collations and fails with
        # SQLSTATE 1267 "Illegal mix of collations".
        #
        # Portability: 1002 is PDO::MYSQL_ATTR_INIT_COMMAND (written as an int
        # because the constant is deprecated in PHP 8.4+). Driver attribute
        # numbers mean different things per driver, so remove this block if
        # switching to Postgres or SQLite.
        options:
            1002: 'SET NAMES utf8mb4 COLLATE utf8mb4_general_ci' # PDO::MYSQL_ATTR_INIT_COMMAND
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        controller_resolver:
            auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
